<title>Scientific Content Workflow</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap"><style id="st">
/* Ignite design system, light: white ground, fuchsia accent, grey cards, Outfit headings, Open Sans body. */
:root{
  --ground:#FFFFFF; --glass:#F7F7F7; --glass-line:#E0E0E0;
  --ink:#0A0A0A; --muted:#64748B; --violet:#5100C2; --navy:#0A0A0A; --blue:#DA3FF6;
  --sky:#DA3FF6; --lime:#DA3FF6; --teal:#DA3FF6; --fuchsia:#DA3FF6; --good:#0A0A0A; --good-soft:rgba(218,63,246,.10);
  --chip:#FFFFFF; --l1-bg:#F1BDFB; --l1-fg:#0A0A0A; --red-bg:#fdeaea; --red-fg:#b42318; --red-line:#f3b4ae;
  --shadow:0 2px 6px rgba(16,12,30,.08),0 8px 24px rgba(16,12,30,.06);
  --display:"Outfit","Open Sans",system-ui,sans-serif; --sans:"Open Sans",Arial,Helvetica,sans-serif; --mono:"Open Sans",Arial,Helvetica,sans-serif;
}
.demo{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 16px;border-radius:14px;background:var(--red-bg);color:var(--red-fg);border:1px solid var(--red-line);font-size:14.5px;font-weight:600}
.demo b{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--red-fg);color:var(--ground);font-size:13px}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:16px 64px}
section{padding-inline:clamp(0px,1.5vw,12px)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:clamp(24px,3vw,32px);font-weight:600}
h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-right:8px;vertical-align:middle}
.eyebrow{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:10px}

/* hero */
.hero{position:relative;border-radius:28px;overflow:hidden;color:#fff;padding:20px clamp(20px,5vw,64px) clamp(110px,14vw,150px);
  background:
   radial-gradient(60% 70% at 12% 20%,#312984 0%,transparent 70%),
   radial-gradient(45% 60% at 30% 60%,#3a6fd0 0%,transparent 70%),
   radial-gradient(40% 55% at 62% 42%,#c7f97f 0%,transparent 70%),
   radial-gradient(45% 60% at 88% 70%,#7dcde6 0%,transparent 70%),
   radial-gradient(50% 60% at 85% 10%,#4e74b4 0%,transparent 70%),
   linear-gradient(135deg,#223e72 0%,#2f5aa8 45%,#6fc6a0 75%,#9fd9ee 100%)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,50,.18),rgba(10,20,50,0) 40%,rgba(10,20,50,.12));pointer-events:none}
.hero>*{position:relative;z-index:1}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 14px;border:1px solid rgba(255,255,255,.28);border-radius:18px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px)}
.bar img{height:38px;width:auto;filter:brightness(0) invert(1)}
.pill{display:inline-flex;align-items:center;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);white-space:nowrap}
.hero .eyebrow{color:rgba(255,255,255,.9);margin-top:clamp(48px,8vw,84px)}
.hero h1{font-size:clamp(34px,5.6vw,64px);line-height:1.05;font-weight:700;max-width:16ch;text-shadow:0 1px 18px rgba(20,30,80,.25)}
.hero .lead{font-size:clamp(17px,1.6vw,19px);max-width:62ch;margin:22px 0 6px;font-weight:500;text-shadow:0 1px 12px rgba(20,30,80,.25)}
.hero .sub{max-width:62ch;margin:0;color:rgba(255,255,255,.9);font-weight:500}

/* glass */
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
section{margin-top:72px}
.lift{margin-top:calc(-1 * clamp(80px,10vw,110px));position:relative;z-index:2;padding:clamp(22px,3.6vw,40px)}
.intro{color:var(--muted);max-width:65ch;margin:10px 0 22px}

/* before / after */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.tdc{padding:22px 24px;border-radius:18px;background:var(--chip);min-width:0}
.tdc h3{margin-bottom:6px}.tdc p{margin:0;font-size:14.5px;line-height:1.55;color:var(--muted)}
.bab{padding:clamp(22px,3.6vw,40px)}
.win{margin-top:18px;padding:22px 26px;border-radius:18px;color:#fff;background:radial-gradient(50% 120% at 10% 30%,#312984,transparent 70%),radial-gradient(45% 120% at 80% 50%,#6cc3a3,transparent 70%),linear-gradient(120deg,#223e72,#3d6cc4)}
.win .wh{font-weight:700;font-size:17px;margin-bottom:6px}.win p{margin:0;font-size:15.5px;line-height:1.55}.win .ws{margin-top:8px;font-weight:600;color:#c7f97f}
@media (max-width:760px){.today{grid-template-columns:1fr}}
.ba{display:grid;grid-template-columns:minmax(90px,auto) 1fr 1fr;gap:0 14px;margin-top:16px}
.ba>.k{font-weight:700;font-size:14.5px;color:var(--navy);padding-left:4px}
.ba>div{padding:14px 22px;display:flex;gap:12px;align-items:flex-start;min-width:0;border-bottom:1px solid var(--glass-line);font-size:15px}
.ba .hd{font-weight:600;font-size:14px;color:var(--muted);border-bottom:none;padding-bottom:4px}
.ba .r{background:var(--good-soft);color:var(--ink)}
.ba .r.hd{background:none}
.ba .r:not(.hd){border-radius:0}
.mk{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.l .mk{background:var(--chip);color:var(--muted)}
.r .mk{background:var(--lime);color:#fff}

/* stages */
.flow{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:16px 28px;align-items:stretch}
.flow.expanded{grid-auto-rows:auto}
.st{position:relative;display:flex;flex-direction:column;min-width:0}
.st:not(:nth-child(4n))::after{content:"";position:absolute;right:-19px;top:50%;width:9px;height:9px;border-top:2px solid var(--blue);border-right:2px solid var(--blue);transform:translateY(-50%) rotate(45deg);opacity:.6}
.st .sb{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;width:100%;flex:1;padding:26px 26px 18px;cursor:pointer;border-radius:22px}
.st .sb:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.st .no{font-size:13px;font-weight:600;color:var(--muted)}
.st .n{font-size:20px;font-weight:700;letter-spacing:-.02em}
.st .c{font-family:var(--mono);font-size:12.5px;color:var(--teal)}
.st .d{font-size:14.5px;line-height:1.5;color:var(--ink);margin-top:2px}
.st .chev{margin-top:auto;padding-top:10px}
.st .chev span{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--chip);color:var(--blue);font-size:12px;transition:transform .2s}
.st.open .chev span{transform:rotate(180deg);background:var(--lime);color:#fff}
.st.open{box-shadow:0 0 0 2px var(--blue)}
.st .more{padding:14px 26px 24px;font-size:14.5px;line-height:1.55;border-top:1px solid var(--glass-line);margin:0 8px}
.st .ai{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sbul{margin:0;padding-left:18px}.sbul li{margin-bottom:5px}
.you{display:inline-flex;align-items:center;margin-top:10px;background:var(--good-soft);color:var(--good);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}

/* counters */
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 18px}
.cnt{padding:26px 28px;text-align:left}
.cnt b{display:block;font-size:52px;line-height:1;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  background:linear-gradient(120deg,#312984,#4e74b4 45%,#2fb3a8 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.cnt span{display:block;margin-top:8px;font-size:15px;font-weight:500;color:var(--muted)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{padding:26px 28px;min-width:0}
.card h3{margin-bottom:8px;display:flex;align-items:center;gap:10px}
.card p{margin:0;font-size:14.5px;line-height:1.6;color:var(--muted)}
.lv{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:4px 12px;margin-bottom:12px;background:var(--l1-bg);color:var(--l1-fg)}
.lv.l2{background:#4e74b4;color:#fff}
.lv.l3{background:#312984;color:#fff}
.lv.hu{background:#c7f97f;color:#fff}
.lvgroup{margin-top:30px}
.lvhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lvhead .lv{margin-bottom:0}
.lvhead h3{font-size:18px}
.num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#312984,#4e74b4);color:#fff;font-size:12px;font-variant-numeric:tabular-nums}
.layers{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin-top:6px}.layers>.layer{flex:0 1 calc((100% - 36px)/3)}
.st .out{font-size:13px;font-weight:600;color:var(--navy);margin-top:4px}
.layer{padding:24px 24px 20px;min-width:0}
.layer .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
.layer .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.layer h3{font-size:18px;margin:2px 0 12px}
.layer ul{margin:0;padding-left:18px}
.layer li{font-size:14px;line-height:1.5;margin-bottom:7px}
.custom{margin:20px 0 0;font-size:15px;font-weight:500;color:var(--ink)}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}

.nx{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:22px}
@media (max-width:960px){.nx{grid-template-columns:1fr 1fr}}@media (max-width:560px){.nx{grid-template-columns:1fr}}
@media (max-width:860px){.layers>.layer{flex-basis:calc((100% - 18px)/2)}}@media (max-width:560px){.layers>.layer{flex-basis:100%}}
/* cta + footer */
.cta{margin-top:56px;border-radius:28px;padding:clamp(28px,5vw,48px);color:#fff;font-size:clamp(20px,2.4vw,28px);font-weight:600;letter-spacing:-.02em;
  background:radial-gradient(50% 90% at 15% 30%,#312984,transparent 70%),radial-gradient(45% 80% at 70% 40%,#c7f97f,transparent 70%),radial-gradient(40% 90% at 95% 80%,#7dcde6,transparent 70%),linear-gradient(120deg,#223e72,#3d6cc4 55%,#6cc3a3)}
.cta span{display:block;text-shadow:0 1px 14px rgba(20,30,80,.3)}
.credit{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;font-size:13px;color:var(--muted)}
.credit img{height:30px;width:auto}

@media (max-width:860px){.flow{grid-template-columns:1fr 1fr;grid-auto-rows:auto}.st::after{display:none}.counters{grid-template-columns:1fr}}
@media (max-width:560px){.flow{grid-template-columns:1fr}.ba{grid-template-columns:1fr}.ba .r.hd,.ba .k.hd{display:none}.ba .l{border-bottom:none}.ba>.k{border-bottom:none;padding-bottom:0;padding-top:18px}.pill{display:none}}
@media (prefers-reduced-motion:reduce){.st .chev span{transition:none}}

.editbar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;background:#223e72;color:#fff;box-shadow:0 10px 28px rgba(15,24,48,.25);font-family:var(--sans);font-size:14px}
.editbar button{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;font-weight:600}
.editbar button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.editbar .pri{background:#c7f97f;color:#fff}
.editbar .msg{padding:0 10px;font-size:13px}
body.editing [data-k]{outline:1px dashed rgba(78,116,180,.65);outline-offset:2px;border-radius:4px;cursor:text}
body.editing [data-k]:focus{outline:2px solid #4e74b4;background:rgba(199,249,127,.2)}
body.editing .hero [data-k]{outline-color:rgba(255,255,255,.75)}
body.editing .st .sb{cursor:default}
.wm{font-weight:700;font-size:20px;letter-spacing:-.02em;color:#fff;white-space:nowrap}
.credit .wm{font-size:16px;color:var(--ink)}

/* ignite light overrides */
.wm{display:none}
h1,h2,h3,.eyebrow,.st .n,.cnt b,.win .wh,.cta{font-family:var(--display)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--fuchsia)}
h2::after{content:"";display:block;width:96px;height:6px;border-radius:3px;margin-top:14px;background:linear-gradient(to right,#5100C2,#DA3FF6)}
.hero{color:var(--ink);background:radial-gradient(circle at 92% 4%,#F1BDFB 0%,#FFFFFF 52%);border:1px solid var(--glass-line)}
.hero::after{display:none}
.hero h1{font-weight:800;text-shadow:none}
.hero h1::after{content:"";display:block;width:112px;height:8px;border-radius:4px;margin-top:22px;background:linear-gradient(to right,#5100C2,#DA3FF6)}
.hero .eyebrow{color:var(--fuchsia)}
.hero .lead{text-shadow:none;color:var(--ink)}
.bar{border:1px solid var(--glass-line);background:rgba(255,255,255,.7);backdrop-filter:none}
.bar img{filter:none}
.pill{border:1px solid var(--glass-line);background:#fff;color:var(--ink)}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:20px;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:var(--shadow)}
.tdc{border:1px solid var(--glass-line)}
.win{background:linear-gradient(135deg,#FBE9FE,#F7F7F7);border:1px solid #F1BDFB;color:var(--ink)}
.win .wh{color:var(--ink)}
.win .ws{color:var(--ink)}
.r .mk{background:var(--fuchsia);color:#fff}
.st.open .chev span{background:var(--fuchsia);color:#fff}
.st .c{font-weight:700;font-size:13px}
.cnt b{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--fuchsia)}
.num{background:linear-gradient(135deg,#5100C2,#DA3FF6);color:#fff}
.lv.l2{background:#DA3FF6;color:#fff}
.lv.l3{background:#0A0A0A;color:#fff}
.lv.hu{background:linear-gradient(90deg,#5100C2,#DA3FF6);color:#fff}
.cta{color:#fff;background:linear-gradient(120deg,#5100C2,#DA3FF6)}
.editbar{background:var(--ink)}
.editbar .pri{background:var(--fuchsia);color:#fff}
body.editing [data-k]{outline-color:rgba(218,63,246,.7)}
body.editing [data-k]:focus{outline-color:#DA3FF6;background:rgba(218,63,246,.08)}
body.editing .hero [data-k]{outline-color:rgba(218,63,246,.7)}
.cta .btn{display:inline-block;margin-top:24px;padding:16px 28px;border-radius:14px;background:#fff;color:#0A0A0A;font:700 17px/1.2 var(--display);letter-spacing:0;text-decoration:none;box-shadow:0 4px 14px rgba(16,12,30,.25);text-shadow:none}
.cta .btn:hover{background:#0A0A0A;color:#fff}
.cta .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.credit{margin-top:40px}
.ba .r:not(.hd){background:#fff;border:0 solid var(--fuchsia);border-left-width:1.5px;border-right-width:1.5px;border-bottom:1px solid var(--glass-line);border-radius:0}
.ba .r.rt:not(.hd){border-top-width:1.5px;border-top-left-radius:16px;border-top-right-radius:16px}
.ba .r.rb:not(.hd){border-bottom:1.5px solid var(--fuchsia);border-bottom-left-radius:16px;border-bottom-right-radius:16px}
@media (max-width:560px){.ba .r:not(.hd){border:1.5px solid var(--fuchsia);border-radius:16px;margin-top:6px}}

ur brand identity", "get.3.p": "Branded Word files, or built in your own template.", "ly.0.li.0": "Your five research rules", "ly.0.li.1": "Hard rule: every fact checked and traced to its source", "ly.0.li.2": "Asks your team when unclear", "ly.0.li.3": "Named sign-off before final files", "ly.0.li.4": "No wording copied from a study without quotes", "ly.2.li.0": "PubMed", "ly.2.li.1": "Firecrawl", "ly.2.li.2": "Web search", "ly.2.li.3": "Claude Docs for review", "ly.2.li.4": "Word and Excel builders", "chk.0.t": "Science scored on its own", "chk.0.p": "Each study gets two scores: strength of the science and use to your team. A weak study stays marked weak, even if it suits the message.", "chk.1.t": "Exact quotes, verified", "chk.1.p": "Each claim keeps the exact sentence and page from its study. The AI finds that sentence word for word in the study, or flags it.", "chk.2.t": "Context kept", "chk.2.p": "Each finding keeps its patient group and limits. A rate from one group is never reported as the rate for everyone.", "chk.3.t": "Clear evidence levels", "chk.3.p": "Each claim is labeled as proven, likely or modeled, and worded to match.", "chk.4.t": "Full studies only", "chk.4.p": "An abstract alone never supports a claim.", "chk.5.t": "Gaps stay visible", "chk.5.p": "Where evidence is missing, the gap is shown. No number is made up to fill it.", "chk.6.t": "Draft matches the evidence", "chk.6.p": "Every quote and number in the draft is matched to its study and page.", "chk.7.t": "No copied text", "chk.7.p": "A tool compares the draft with every study. Copied sentences are put in quotes or rewritten.", "chk.8.t": "Your voice, no AI tells", "chk.8.p": "Banned words and machine-sounding phrases are rewritten.", "chk.9.t": "Charts match the evidence", "chk.9.p": "Every number in a chart is checked against the evidence list.", "chk.10.t": "The big guns review", "chk.10.p": "A more powerful AI model reads the paper cold and flags problems to fix.", "chk.11.t": "A person signs off", "chk.11.p": "A named person approves before any Word file is built.", "chk.12.t": "Final files checked", "chk.12.p": "After the build, the AI reads each Word file back. It confirms every reference resolves and every chart is in place.", "td.h": "How whitepapers get made today", "td.0.h": "Write it in-house", "td.0.p": "Your experts write it from scratch, next to their day jobs. Papers could take weeks and often stall.", "td.1.h": "Hire an agency", "td.1.p": "An agency writes it for \u20ac\u20ac\u20ac per paper, limiting the number of papers you could create a year.", "td.2.h": "Use AI chat", "td.2.p": "Someone prompts an LLM. It's quick to start, but you start from scratch every time. Hours of prompting, and still no paper ready to approve.", "win.h": "What you get with the workflow:", "win.p": "An unlimited number of complete, verified whitepapers. AI executes consistent, reliable output, every time you run it. An expert supervises.", "win.s": "You simply answer questions, command AI, and sign off. You own the workflow forever.", "ba.0.k": "Method", "ba.0.l": "The method is dependent on how AI decides how to run it, leaving room for hallucinations.", "ba.0.r": "One set system with strict guardrails. The same stages and checks run every time. Stages move on only after human approval.", "ba.1.k": "Evidence", "ba.1.l": "Sources are missing or unchecked. Findings drop out and numbers change without notice.", "ba.1.r": "One evidence list holds every finding, with its quote and page. The draft must match it. Gaps are flagged for your team.", "ba.2.k": "Context", "ba.2.l": "Company context explained again in every chat", "ba.2.r": "Your brand, goals, internal data and more are stored in the system. The AI pulls what each paper needs.", "ba.3.k": "Format", "ba.3.l": "Drafts too long or too full of numbers", "ba.3.r": "Multiple templates built in. Length and format agreed before drafting every paper.", "ba.4.k": "Visuals", "ba.4.l": "Charts & visuals built one by one", "ba.4.r": "Charts, graphics, icons, built in the brand style from the checked numbers", "ba.5.k": "Branding", "ba.5.l": "Brand layout done by hand at the end", "ba.5.r": "Every Word file comes out in your brand look and template.", "st.0.b.0": "Asks seven short questions about your topic and reader", "st.0.b.1": "Fills in the rest from what it already knows about your company", "st.0.b.2": "Writes the full brief for you to check", "st.1.b.0": "Parallel agents search PubMed and guideline sites", "st.1.b.1": "Scores every study twice: strength of the science and use to you", "st.1.b.2": "Proposes two or three angles for the paper", "st.2.b.0": "Pulls every claim with its exact quote and page", "st.2.b.1": "Adds each finding's patient group and evidence level", "st.2.b.2": "Marks any gaps and saves an Excel view", "st.3.b.0": "Fills your chosen paper template, section by section", "st.3.b.1": "Sets a word budget and the claims for each section", "st.3.b.2": "Plans the charts before any writing starts", "st.4.b.0": "Writes 2,000+ words, one section at a time", "st.4.b.1": "Uses approved claims only, with tables and numbered references", "st.5.b.0": "Turns checked numbers into charts and diagrams in your brand", "st.5.b.1": "Puts the source under every chart and rechecks each number", "st.6.b.0": "Fresh checks on the science and on every chart", "st.6.b.1": "Copy check and voice check, then a stronger AI reads it cold", "st.6.b.2": "Fixes every problem and shows each fix as a before and after", "st.7.b.0": "Builds the whitepaper, dossier and one-pager in Word", "st.7.b.1": "Reads each file back to confirm references and charts", "nx.eyebrow": "Next steps", "nx.h": "From demo to your own system", "nx.0.h": "Send us your complete brief", "nx.0.p": "Your topics, readers, sources and brand rules, in one place.", "nx.1.h": "We send a scope of work and a quote", "nx.1.p": "A fixed scope and price before any build starts.", "nx.2.h": "We build, you test, we refine", "nx   h+='<header class="hero"><div class="bar"><img src="'+C._logo+'" alt="Ignite AI Consulting"></div>'+T('hero.eyebrow','div','eyebrow')+T('hero.h1','h1')+T('hero.lead','p','lead')+'</header>';
  h+='<div class="glass lift"><h2>'+dot+T('td.h')+'</h2><div class="today">';for(let i=0;i<count('td.','.h');i++)h+='<div class="tdc">'+T('td.'+i+'.h','h3')+T('td.'+i+'.p','p')+'</div>';h+='</div><div class="win">'+T('win.h','div','wh')+T('win.p','p')+T('win.s','p','ws')+'</div></div>';h+='<section><div class="glass bab"><h2>'+dot+T('ba.h')+'</h2><div class="ba"><div class="k hd"></div>'+T('ba.hl','div','l hd')+T('ba.hr','div','r hd');
  for(let i=0;i<count('ba.','.l');i++)h+=T('ba.'+i+'.k','div','k')+'<div class="l"><span class="mk">&#10005;</span>'+T('ba.'+i+'.l')+'</div><div class="r"><span class="mk">&#10003;</span>'+T('ba.'+i+'.r')+'</div>';
  h+='</div></div></section>';
  h+='<section><div class="eyebrow">'+dot+T('how.eyebrow')+'</div>'+T('how.h','h2')+T('how.intro','p','intro')+'<div class="flow" id="flow">';
  for(let i=0;i<count('st.','.name');i++)h+='<div class="st glass" data-i="'+i+'"><div class="sb" role="button" tabindex="0" aria-expanded="false"><span class="no">Stage '+(i+1)+'</span>'+T('st.'+i+'.name','span','n')+'<span class="c">'+E(C['st.'+i+'.cmd'])+'</span>'+T('st.'+i+'.line','span','d')+'<span class="out">Output: '+T('st.'+i+'.out')+'</span>'+'<span class="chev"><span aria-hidden="true">&#9662;</span></span></div><div class="more" hidden><div class="ai">AI does</div><ul class="sbul">'+(()=>{let s='';for(let j=0;j<count('st.'+i+'.b.','');j++)s+=T('st.'+i+'.b.'+j,'li');return s;})()+'</ul><span class="you">You:&nbsp;'+T('st.'+i+'.you')+'</span></div></div>';
  h+='</div></section>';
  h+='<section><div class="eyebrow">'+dot+T('brief.eyebrow')+'</div>'+T('brief.h','h2')+T('brief.intro','p','intro')+'<div class="layers">';
  ICONS.forEach((ic,i)=>{h+='<div class="glass layer"><div class="ic" style="background:'+ic[0]+';color:'+ic[1]+'">'+ic[2]+'</div>'+T('ly.'+i+'.k','div','k')+T('ly.'+i+'.h','h3')+'<ul>';
    for(let j=0;j<count('ly.'+i+'.li.','');j++)h+=T('ly.'+i+'.li.'+j,'li');
    h+='</ul></div>';});
  h+='</div><p class="custom">'+dot+T('custom')+'</p></section>';
  h+='<section><div class="eyebrow">'+dot+T('acc.eyebrow')+'</div>'+T('acc.h','h2')+'<div class="counters">';
  for(let i=0;i<3;i++)h+='<div class="glass cnt">'+T('cnt.'+i+'.n','b')+T('cnt.'+i+'.l')+'</div>';
  h+='</div>';
  GROUPS.forEach((g,gi)=>{h+='<div class="lvgroup"><div class="lvhead">'+T('lvl.'+gi+'.label','span',g[0])+T('lvl.'+gi+'.h','h3')+'</div><div class="grid">';
    for(let i=g[1];i<g[2];i++)h+='<div class="glass card"><h3><span class="num">'+(i+1)+'</span>'+T('chk.'+i+'.t')+'</h3>'+T('chk.'+i+'.p','p')+'</div>';
    h+='</div></div>';});
  h+='</section>';
  h+='<section><div class="eyebrow">'+dot+T('get.eyebrow')+'</div>'+T('get.h','h2')+'<div class="grid" style="margin-top:22px">';
  for(let i=0;i<count('get.','.h');i++)h+='<div class="glass card">'+T('get.'+i+'.h','h3')+T('get.'+i+'.p','p')+'</div>';
  h+='</div></section>';h+='<section><div class="eyebrow">'+dot+T('nx.eyebrow')+'</div>'+T('nx.h','h2')+'<div class="nx">';for(let i=0;i<count('nx.','.h');i++)h+='<div class="glass card"><h3><span class="num">'+(i+1)+'</span>'+T('nx.'+i+'.h')+'</h3>'+T('nx.'+i+'.p','p')+'</div>';h+='</div></section>'+T('foot','p','foot')+'<div class="credit"><img src="'+C._logo+'" alt="Ignite AI Consulting">'+T('credit')+'</div><div class="cta">'+T('cta')+'<a class="btn" href="https://cal.com/poulomi-basu/ai-growth-system-call" target="_blank" rel="noopener">Book an AI Growth System call</a></div></div>';
  h+='<div class="editbar" id="editbar" hidden><span class="msg" id="msg" aria-live="polite"></span><button type="button" id="b-edit" class="pri">Edit text</button><button type="button" id="b-cancel" hidden>Cancel</button><button type="button" id="b-save" class="pri" hidden>Save</button></div>';
  document.getElementById('app').innerHTML=h;
  wire();
  markCol();
}
function markCol(){const rs=[...document.querySelectorAll('.ba .r:not(.hd)')];rs.forEach((r,i)=>{r.classList.toggle('rt',i===0);r.classList.toggle('rb',i===rs.length-1);});}
const flowState=()=>document.getElementById('flow');
function toggle(st){const sb=st.querySelector('.sb'),m=st.querySelector('.more');const open=m.hidden;m.hidden=!open;st.classList.toggle('open',open);sb.setAttribute('aria-expanded',String(open));const f=flowState();f.classList.toggle('expanded',!!f.querySelector('.st.open'));}
let art=null,canWrite=false;
function wire(){
  document.querySelectorAll('.st').forEach(st=>{const sb=st.querySelector('.sb');
    sb.addEventListener('click',()=>{if(!document.body.classList.contains('editing'))toggle(st);});
    sb.addEventListener('keydown',e=>{if(document.body.classList.contains('editing'))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(st);}});});
  const bar=document.getElementById('editbar');bar.hidden=!canWrite;
  document.getElementById('b-edit').onclick=startEdit;
  document.getElementById('b-cancel').onclick=()=>{document.body.classList.remove('editing');render();};
  document.getElementById('b-save').onclick=save;
}
function msg(t){document.getElementById('msg').textContent=t||'';}
function startEdit(){
  document.body.classList.add('editing');
  document.querySelectorAll('[data-k]').forEach(el=>{el.setAttribute('contenteditable','plaintext-only');if(el.contentEditable!=='plaintext-only')el.setAttribute('contenteditable','true');
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();}});});
  document.querySelectorAll('.st').forEach(st=>{st.querySelector('.more').hidden=false;st.classList.add('open');});
  flowState().classList.add('expanded');
  document.getElementById('b-edit').hidden=true;document.getElementById('b-cancel').hidden=false;document.getElementById('b-save').hidden=false;
  msg('Click any text to change it.');
}
function buildDoc(state){
  const json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
   +'<title>Scientific Content Workflow</title>'+FONTS+'<style id="st">'+document.getElementById('st').textContent+'</style>'
   +'<div id="app"></div><script type="application/json" id="copy">'+json+'<\/script><script id="app-js">'+document.getElementById('app-js').textContent+'<\/script></body></html>';
}
async function save(){
  const next=Object.assign({},C);let changed=false;
  document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k,v=el.innerText.replace(/\s+/g,' ').trim();if(v&&v!==C[k]){next[k]=v;changed=true;}});
  if(!changed){document.body.classList.remove('editing');render();return;}
  const bs=document.getElementById('b-save');bs.disabled=true;msg('Saving...');
  const attempt=async(retry)=>{try{await art.publish(buildDoc(next));msg('Saved. Reloading...');}
    catch(e){const c=e&&e.code;
      if(c==='conflict'){msg('A newer version was saved. Reloading.');}
      else if(['not_writer','not_granted','not_declared','consent_required','capability_disabled','capability_removed'].includes(c)){msg('This view is read-only.');canWrite=false;}
      else if(c==='rate_limited'){msg('Saving too often. Try again in a minute.');bs.disabled=false;}
      else if(c==='too_large'||c==='invalid_content'||c==='transform_error'){msg('Could not save this page.');bs.disabled=false;}
      else if(!retry){setTimeout(()=>attempt(true),600+Math.random()*900);}
      else{msg('Could not save. Try again.');bs.disabled=false;}}};
  attempt(false);
}
window.addEventListener('resize',markCol);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(markCol);
render();
(async()=>{try{const cl=window.claude;if(!cl||!cl.use)return;art=await cl.use('artifact');if(!art)return;
  let ok=true;try{const u=await cl.use('user');if(u)ok=await u.canEdit();}catch(e){}
  canWrite=ok;const bar=document.getElementById('editbar');if(bar&&!document.body.classList.contains('editing'))bar.hidden=!canWrite;}catch(e){}})();
})();
</script>
